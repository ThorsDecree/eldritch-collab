[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vestigia-runtime"
version = "0.8.0.dev0"
description = "A portable, consent-first continuity runtime for one resident, with plural-ready bones."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "ThorsDecree" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyYAML>=6.0",
    "openai>=2.0.0",
    "Pillow>=10.0.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
discord = [
    "discord.py>=2.3.2",
]
web-ui = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]
tokens = [
    "tiktoken>=0.7.0",
]
mcp-context = [
    "mcp>=2.0,<3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
vestigia = "vestigia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
