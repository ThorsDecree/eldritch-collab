[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vestigia-runtime"
version = "0.7.0.dev0"
description = "A portable, consent-first continuity runtime for one resident, with plural-ready bones."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ThorsDecree" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "PyYAML>=6.0",
    "openai>=2.0.0",
    "Pillow>=10.0.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
discord = [
    "discord.py>=2.3.2",
]
tokens = [
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
vestigia = "vestigia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
