name: VESTIGIA MCP Server

on:
  push:
    paths:
      - "VESTIGIA_MCP_Server/**"
      - ".github/workflows/vestigia-mcp-server.yml"
  pull_request:
    paths:
      - "VESTIGIA_MCP_Server/**"
      - ".github/workflows/vestigia-mcp-server.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: VESTIGIA_MCP_Server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: VESTIGIA_MCP_Server/pyproject.toml

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest
