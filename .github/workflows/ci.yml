name: Harden Script Shelf

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: harden-script-shelf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.head_ref == 'agent/resident-script-shelf'
    runs-on: windows-latest

    steps:
      - name: Check out shelf branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Merge composition foundation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin agent/runtime-composition-hardening
          git merge -X theirs --no-edit origin/agent/runtime-composition-hardening
          git checkout origin/agent/runtime-composition-hardening -- .github/workflows/ci.yml VESTIGIA_Runtime/src/vestigia/__init__.py

      - name: Apply inert shelf and atomic lifecycle hardening
        shell: pwsh
        run: python .github/scripts/harden_script_shelf.py

      - name: Compile and test hardened stack
        working-directory: VESTIGIA_Runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,discord,tokens]"
          python -m compileall -q src
          python -m pytest -q

      - name: Publish hardened stack
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: make script shelf inert and lifecycle-atomic"
          git push origin "HEAD:${{ github.head_ref }}"
