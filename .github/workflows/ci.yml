name: Runtime CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Windows, Python ${{ matrix.python_version }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.11"
            package_smoke: true

          - python_version: "3.14"
            package_smoke: false

    runs-on: windows-latest

    defaults:
      run:
        working-directory: VESTIGIA_Runtime
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: VESTIGIA_Runtime/pyproject.toml

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,discord,tokens]"
          python -m pip check

      - name: Compile source
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest -q

      - name: Build distribution
        if: matrix.package_smoke
        run: |
          python -m pip install build
          python -m build

      - name: Verify isolated wheel installation
        if: matrix.package_smoke
        run: |
          $ErrorActionPreference = "Stop"

          python -m venv .wheel-smoke
          $smokePython = Join-Path $PWD ".wheel-smoke\Scripts\python.exe"

          & $smokePython -m pip install --upgrade pip

          $wheel = (
            Get-ChildItem "dist\*.whl" |
            Select-Object -First 1
          ).FullName

          if (-not $wheel) {
            throw "No wheel found in dist"
          }

          & $smokePython -m pip install "${wheel}[discord,tokens]"
          & $smokePython -m pip check
          & $smokePython -c "import vestigia, discord, tiktoken; assert vestigia.__version__ == '0.7.0.dev0'"
