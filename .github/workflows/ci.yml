name: Runtime CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python_version }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python_version: "3.11"
            package_smoke: true

          - os: ubuntu-latest
            python_version: "3.13"
            package_smoke: false

          - os: windows-latest
            python_version: "3.11"
            package_smoke: false

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: VESTIGIA_Runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: VESTIGIA_Runtime/pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest -q

      - name: Build distribution
        if: matrix.package_smoke
        run: |
          python -m pip install build
          python -m build

      - name: Verify isolated wheel installation
        if: matrix.package_smoke
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -c "import vestigia; assert vestigia.__version__ == '0.7.0.dev0'"
