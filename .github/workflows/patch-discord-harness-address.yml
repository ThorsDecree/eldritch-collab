name: One-shot Discord harness address assertion repair

on:
  push:
    branches:
      - agent/discord-recovery-harness
    paths:
      - .github/workflows/patch-discord-harness-address.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/discord-recovery-harness
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Patch bool/object-compatible address assertions
        shell: python
        run: |
          from pathlib import Path

          path = Path('VESTIGIA_Runtime/tests/test_discord_harness.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert decision.addressed is True'
          new = 'assert bool(getattr(decision.addressed, "addressed", decision.addressed)) is True'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 legacy address assertions, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Install focused test dependencies
        working-directory: VESTIGIA_Runtime
        run: python -m pip install -e '.[dev,discord]'

      - name: Run focused Discord harness suite
        working-directory: VESTIGIA_Runtime
        run: python -m pytest tests/test_discord_harness.py -q

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'kowen9024AI'
          git config user.email '267743825+kowen9024AI@users.noreply.github.com'
          git rm .github/workflows/patch-discord-harness-address.yml
          git add VESTIGIA_Runtime/tests/test_discord_harness.py
          git commit -m 'test: accept structured Discord address decisions [address-patched]'
          git push origin HEAD:agent/discord-recovery-harness
