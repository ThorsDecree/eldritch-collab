name: One-shot DiscordDoor address provenance repair

on:
  push:
    branches:
      - agent/discord-door-extraction-prototype
    paths:
      - .github/workflows/patch-discord-door-address.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/discord-door-extraction-prototype
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Preserve structured address provenance
        shell: python
        run: |
          from pathlib import Path

          door = Path('VESTIGIA_Runtime/src/vestigia/adapters/discord_door.py')
          text = door.read_text(encoding='utf-8')
          text = text.replace('AddressClassifier = Callable[..., bool]', 'AddressClassifier = Callable[..., Any]')
          text = text.replace(
              '    addressed: bool\n    trigger_kind: str\n',
              '    addressed: bool\n    address_signal_kind: str | None\n    trigger_kind: str\n',
          )
          text = text.replace(
              '                addressed=False,\n                trigger_kind="ignored",\n',
              '                addressed=False,\n                address_signal_kind=None,\n                trigger_kind="ignored",\n',
          )
          old = '''        addressed = self.dependencies.guild_message_is_addressed(\n            is_dm=is_dm,\n            content=content,\n            bot_is_mentioned=bot_is_mentioned,\n            replies_to_bot=replies_to_bot,\n            require_mention_or_reply=bool(self.require_mention_or_reply),\n        )\n        controls = self.dependencies.load_resident_controls(\n'''
          new = '''        address_result = self.dependencies.guild_message_is_addressed(\n            is_dm=is_dm,\n            content=content,\n            bot_is_mentioned=bot_is_mentioned,\n            replies_to_bot=replies_to_bot,\n            require_mention_or_reply=bool(self.require_mention_or_reply),\n        )\n        addressed = bool(getattr(address_result, "addressed", address_result))\n        address_signal_kind = getattr(address_result, "signal_kind", None)\n        controls = self.dependencies.load_resident_controls(\n'''
          if old not in text:
              raise SystemExit('address classifier block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '            addressed=addressed,\n            trigger_kind=str(trigger.get("kind") or "ignored"),\n',
              '            addressed=addressed,\n            address_signal_kind=(\n                str(address_signal_kind) if address_signal_kind is not None else None\n            ),\n            trigger_kind=str(trigger.get("kind") or "ignored"),\n',
              1,
          )
          door.write_text(text, encoding='utf-8')

          tests = Path('VESTIGIA_Runtime/tests/test_discord_door_prototype.py')
          text = tests.read_text(encoding='utf-8')
          old = '''    assert actual.rejection == expected.rejection\n    assert actual.addressed == expected.addressed\n    assert actual.trigger_kind == expected.trigger_kind\n'''
          new = '''    assert actual.rejection == expected.rejection\n    expected_addressed = bool(\n        getattr(expected.addressed, "addressed", expected.addressed)\n    )\n    assert actual.addressed == expected_addressed\n    assert actual.address_signal_kind == getattr(expected.addressed, "signal_kind", None)\n    assert actual.trigger_kind == expected.trigger_kind\n'''
          if old not in text:
              raise SystemExit('classification parity assertion block not found')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Install focused test dependencies
        working-directory: VESTIGIA_Runtime
        run: python -m pip install -e '.[dev,discord]'

      - name: Run focused Discord harness and door suites
        working-directory: VESTIGIA_Runtime
        run: python -m pytest tests/test_discord_harness.py tests/test_discord_door_prototype.py -q

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'kowen9024AI'
          git config user.email '267743825+kowen9024AI@users.noreply.github.com'
          git rm .github/workflows/patch-discord-door-address.yml
          git add VESTIGIA_Runtime/src/vestigia/adapters/discord_door.py VESTIGIA_Runtime/tests/test_discord_door_prototype.py
          git commit -m 'test: preserve Discord address signal provenance [door-address-patched]'
          git push origin HEAD:agent/discord-door-extraction-prototype
