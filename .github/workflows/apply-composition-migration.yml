name: Apply composition migration

on:
  push:
    branches:
      - agent/runtime-composition-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[composition-migrated]') }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply explicit composition migration
        shell: pwsh
        run: python .github/scripts/apply_composition_migration.py

      - name: Compile and test migrated tree
        working-directory: VESTIGIA_Runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,discord,tokens]"
          python -m compileall -q src
          python -m pytest -q

      - name: Commit migrated tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: replace runtime monkey patches with explicit composition [composition-migrated]"
          git push origin HEAD:agent/runtime-composition-hardening
