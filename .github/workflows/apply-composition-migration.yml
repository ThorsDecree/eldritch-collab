name: Apply composition migration

on:
  push:
    branches:
      - agent/runtime-composition-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[composition-migrated]') && !contains(github.event.head_commit.message, '[composition-debug]') }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply explicit composition migration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          python .github/scripts/apply_composition_migration.py 2>&1 |
            Tee-Object -FilePath .composition-migration.log
          if ($LASTEXITCODE -ne 0) {
            "MIGRATION_FAILED=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "MIGRATION_FAILED=false" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Compile and test migrated tree
        if: env.MIGRATION_FAILED == 'false'
        working-directory: VESTIGIA_Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          python -m pip install --upgrade pip 2>&1 |
            Tee-Object -FilePath ..\.composition-test.log
          python -m pip install -e ".[dev,discord,tokens]" 2>&1 |
            Tee-Object -FilePath ..\.composition-test.log -Append
          python -m compileall -q src 2>&1 |
            Tee-Object -FilePath ..\.composition-test.log -Append
          python -m pytest -q 2>&1 |
            Tee-Object -FilePath ..\.composition-test.log -Append
          if ($LASTEXITCODE -ne 0) {
            "TESTS_FAILED=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "TESTS_FAILED=false" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Publish result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $failed = ($env:MIGRATION_FAILED -eq "true") -or ($env:TESTS_FAILED -eq "true")
          if ($failed) {
            $migrationLog = Get-Content .composition-migration.log -Raw -ErrorAction SilentlyContinue
            $testLog = Get-Content .composition-test.log -Raw -ErrorAction SilentlyContinue
            git reset --hard HEAD
            @(
              "# Composition migration diagnostic"
              ""
              "## Migration"
              "```text"
              $migrationLog
              "```"
              ""
              "## Tests"
              "```text"
              $testLog
              "```"
            ) | Set-Content .composition-migration-diagnostic.md -Encoding utf8
            git add .composition-migration-diagnostic.md
            git commit -m "chore: publish composition migration failure [composition-debug]"
          } else {
            Remove-Item .composition-migration.log -ErrorAction SilentlyContinue
            Remove-Item .composition-test.log -ErrorAction SilentlyContinue
            Remove-Item .composition-migration-trigger -ErrorAction SilentlyContinue
            git add -A
            git commit -m "refactor: replace runtime monkey patches with explicit composition [composition-migrated]"
          }
          git push origin HEAD:agent/runtime-composition-hardening
