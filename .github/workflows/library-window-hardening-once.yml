name: Library Window hardening once

on:
  push:
    branches:
      - agent/library-window-v0.1
    paths:
      - _library_window_hardening_patch.py
      - .github/workflows/library-window-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[library-window-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/library-window-v0.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic hardening patch
        run: python _library_window_hardening_patch.py

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e VESTIGIA_Runtime

      - name: Compile patched Runtime
        run: python -m compileall -q VESTIGIA_Runtime/src VESTIGIA_Runtime/tests

      - name: Run Library Window tests
        run: >-
          python -m pytest -q
          VESTIGIA_Runtime/tests/test_library_window.py
          VESTIGIA_Runtime/tests/test_library_window_hardening.py
          VESTIGIA_Runtime/tests/test_runtime_bootstrap.py

      - name: Commit validated hardening and remove one-shot runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm _library_window_hardening_patch.py .github/workflows/library-window-hardening-once.yml
          git add VESTIGIA_Runtime/src/vestigia/config.py
          git add VESTIGIA_Runtime/src/vestigia/library_window.py
          git add VESTIGIA_Runtime/src/vestigia/library_window_hardening.py
          git add VESTIGIA_Runtime/tests/test_library_window.py
          git add VESTIGIA_Runtime/tests/test_library_window_hardening.py
          git add VESTIGIA_Runtime/docs/LIBRARY_WINDOW_RUNTIME.md
          git commit -m "security: harden Library Window authority and provenance [library-window-hardened]"
          git push origin HEAD:agent/library-window-v0.1
