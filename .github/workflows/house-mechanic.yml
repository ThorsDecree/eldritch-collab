name: House Mechanic CI

on:
  pull_request:
    paths:
      - "VESTIGIA_House_Mechanic/**"
      - ".github/workflows/house-mechanic.yml"
  push:
    branches: [main]
    paths:
      - "VESTIGIA_House_Mechanic/**"
      - ".github/workflows/house-mechanic.yml"

permissions:
  contents: read

concurrency:
  group: house-mechanic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: VESTIGIA_House_Mechanic
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: VESTIGIA_House_Mechanic/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -q
